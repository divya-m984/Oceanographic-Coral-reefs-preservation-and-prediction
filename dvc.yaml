# dvc.yaml — CoralSense MLOps pipeline DAG (M7)
#
# Run with:
#   dvc repro              # reproduce all changed stages
#   dvc repro generate     # reproduce a single named stage
#   dvc dag                # visualise the DAG
#   dvc status             # show which stages are stale
#   dvc metrics show       # display tracked metrics
#   dvc params diff        # show param changes vs last run
#
# Design notes
# ------------
# - No hardcoded absolute paths; all paths derive from src/config.py.
# - params.yaml is the single source of truth for all tunable values.
# - The MLflow database (artifacts/mlruns.db) is NOT a DVC output; it is
#   managed exclusively by MLflow to avoid unnecessary pipeline invalidation.
# - The register_candidate stage registers a new model version but does NOT
#   promote the champion alias.  Champion promotion remains a controlled
#   manual step via:  python -m src.models.registry --promote

stages:

  # ── M2 ────────────────────────────────────────────────────────────────────
  generate:
    cmd: .venv/bin/python -m src.data.generate_data
    desc: "Generate synthetic coral reef observations from documented statistical rules."
    deps:
      - src/data/generate_data.py
      - src/config.py
    params:
      - base.random_seed
      - data.n_samples
      - data.regions
      - data.noise_scale
    outs:
      - data/raw/observations.csv

  # ── M3 ────────────────────────────────────────────────────────────────────
  validate:
    cmd: .venv/bin/python -m src.data.validate
    desc: "Validate the generated dataset against the Pandera schema. Stops the pipeline on failure."
    deps:
      - src/data/validate.py
      - src/config.py
      - data/raw/observations.csv
    outs:
      - data/raw/observations_validated.csv

  # ── M4 ────────────────────────────────────────────────────────────────────
  preprocess:
    cmd: .venv/bin/python -m src.data.preprocess --input data/raw/observations_validated.csv
    desc: "Stratified train/test split, feature engineering, and ColumnTransformer fitting."
    deps:
      - src/data/preprocess.py
      - src/features/build_features.py
      - src/config.py
      - data/raw/observations_validated.csv
    params:
      - base.random_seed
      - split
      - features
    outs:
      - data/processed/

  # ── M5 ────────────────────────────────────────────────────────────────────
  train:
    cmd: .venv/bin/python -m src.models.train --task all
    desc: "Train LR/RF/XGBoost for both tasks; select best by CV macro-F1; log to MLflow."
    deps:
      - src/models/train.py
      - src/models/evaluate.py
      - src/config.py
      - data/processed/
    params:
      - base.random_seed
      - models.cv_folds
      - models.health
      - models.restoration
    outs:
      - models/best_model_health.joblib
      - models/best_model_restoration.joblib
      - models/evaluation_health.json
      - models/evaluation_restoration.json

  # ── M7 evaluate ───────────────────────────────────────────────────────────
  evaluate:
    cmd: .venv/bin/python -m src.models.run_evaluate
    desc: "Extract key metrics from evaluation JSONs into a single DVC metrics file."
    deps:
      - src/models/run_evaluate.py
      - src/config.py
      - models/evaluation_health.json
      - models/evaluation_restoration.json
    metrics:
      - reports/metrics.json:
          cache: false

  # ── M7 register_candidate ─────────────────────────────────────────────────
  register_candidate:
    cmd: .venv/bin/python -m src.models.run_register_candidate
    desc: "Register best models as MLflow candidates. Champion alias is NOT updated here."
    deps:
      - src/models/run_register_candidate.py
      - src/models/registry.py
      - src/config.py
      - models/best_model_health.joblib
      - models/best_model_restoration.joblib
      - models/evaluation_health.json
      - models/evaluation_restoration.json
      - reports/metrics.json
    outs:
      - reports/candidate_registration.json:
          cache: false

  # ── M11 run_drift ──────────────────────────────────────────────────────────
  run_drift:
    cmd: .venv/bin/python -m src.monitoring.run_drift --no-html
    desc: >
      Generate reference and production windows, run predictions via champion
      models, compute feature/prediction/confidence drift. Saves
      reports/drift_summary.json. HTML reports are excluded from this DVC stage
      (they are large and regenerated on demand via the CLI without --no-html).
    deps:
      - src/monitoring/run_drift.py
      - src/monitoring/drift.py
      - src/monitoring/generate_production.py
      - src/config.py
      - data/raw/observations.csv
      - models/best_model_health.joblib
      - models/best_model_restoration.joblib
      - data/processed/preprocessor_health.joblib
      - data/processed/preprocessor_restoration.joblib
    params:
      - base.random_seed
      - monitoring.reference_n
      - monitoring.production_n
      - monitoring.shift_scale
      - monitoring.drift_threshold
    outs:
      - data/reference/reference.csv
      - data/production/production.csv
    metrics:
      - reports/drift_summary.json:
          cache: false
